# Full CI: Maven build+tests (JDK 21), Embabel agent harness against local Ollama,
# ArcadeAttest architecture decision gate, evidence artifacts. Dependency caching
# for Maven, pip and Ollama models. Local equivalent: scripts/run-ci-local.sh
name: CI (full)
on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: ci-full-${{ github.ref }}
  cancel-in-progress: true
env:
  DECISION_RECORD: .arcade-attest/decision-record.json
  LANGUAGE: kotlin
  ENFORCE_BLOCK: "true"
  ATTEST_INSTALL: "arcade-attest[api] @ git+https://github.com/arcade-red-team/arcade-attest@378037292c77a8d09e8f5ef09c3602ed8741d150"
  ATTEST_PORT: "8787"
  LLM_EXPLAIN: "true"
  RUN_AGENTS: "true"
  OLLAMA_MODEL: "qwen3.5:4b"
  EXPLAIN_MODEL: "qwen2.5:1.5b"   # non-thinking; qwen3.5 returns empty content at max_tokens=220
  OLLAMA_URL: "http://127.0.0.1:11434"
jobs:
  build:
    name: Maven build + tests (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -B -U verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maven-reports
          path: |
            target/surefire-reports/
            target/*.jar
          if-no-files-found: ignore
          retention-days: 7

  agents-and-gate:
    name: Agent harness (Ollama) + ArcadeAttest gate
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21", cache: maven }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: .arcade-attest/decision-record.json }
      - name: Resolve base/head
        id: refs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"; head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"; head="${{ github.sha }}"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base=$(git merge-base "origin/${{ github.event.repository.default_branch }}" "$head")
            fi
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"; echo "head=$head" >> "$GITHUB_OUTPUT"
      - name: Install ArcadeAttest (pinned SHA)
        run: pip install "${ATTEST_INSTALL}" tree-sitter-kotlin
      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ env.OLLAMA_MODEL }}-${{ env.EXPLAIN_MODEL }}
      - name: Install + start Ollama, pull models
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama 2>/dev/null || true
          mkdir -p ~/.ollama/models
          OLLAMA_MODELS=$HOME/.ollama/models nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -sf "$OLLAMA_URL/api/version" && break; sleep 1; done
          ollama pull "$OLLAMA_MODEL"; ollama pull "$EXPLAIN_MODEL"
      - name: Package app
        run: mvn -B -q package -DskipTests
      - name: Decision gate + agent harness
        env:
          BASE_SHA: ${{ steps.refs.outputs.base }}
          HEAD_SHA: ${{ steps.refs.outputs.head }}
        run: bash scripts/ci-steps.sh
      - name: Job summary
        if: always()
        run: |
          [ -f .attest-out/comment.md ] && cat .attest-out/comment.md >> "$GITHUB_STEP_SUMMARY"
          [ -f .attest-out/agent-runs.json ] && { echo '```json'; cat .attest-out/agent-runs.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcade-attest-evidence
          path: |
            .attest-out/
            ollama.log
          if-no-files-found: ignore
